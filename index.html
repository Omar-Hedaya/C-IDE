<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Coding C++</title>
  
  <!-- CodeMirror لتلوين وتنسيق الكود بدون أي أخطاء حقن -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #1a1a1a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* شريط علوي */
    header {
      background: #141414;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #2a2a2a;
      direction: ltr;
    }
    .brand {
      font-weight: 700;
      font-size: 16px;
      color: #e0e0e0;
      letter-spacing: 0.5px;
    }
    .actions {
      display: flex;
      gap: 12px;
    }
    .btn-run {
      background: #00875a;
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-run:active {
      opacity: 0.8;
    }
    .btn-menu {
      background: transparent;
      color: #aaa;
      border: 1px solid #333;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
    }

    /* منطقة المحرر */
    .editor-container {
      flex: 1;
      position: relative;
      direction: ltr; /* اتجاه الكود إنجليزي */
    }
    .CodeMirror {
      height: 100% !important;
      font-family: "Fira Code", Consolas, Monaco, monospace;
      font-size: 14.5px;
      background: #18191a !important;
      line-height: 1.6;
    }
    .CodeMirror-gutters {
      background: #141516 !important;
      border-right: 1px solid #28292a;
    }
    .CodeMirror-linenumber {
      color: #555 !important;
    }
    .highlight-err-line {
      background: rgba(235, 87, 87, 0.25) !important;
    }

    /* شريط المفاتيح السريعة بالأسفل */
    .toolbar {
      background: #111;
      padding: 6px 8px;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      border-top: 1px solid #262626;
      white-space: nowrap;
      direction: ltr;
      scrollbar-width: none;
    }
    .toolbar::-webkit-scrollbar {
      display: none;
    }
    .tool-btn {
      background: #222;
      color: #ddd;
      border: 1px solid #333;
      padding: 6px 12px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 14px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .tool-btn:active {
      background: #333;
    }

    /* نافذة شاشة التشغيل (Terminal) */
    .terminal-screen {
      position: fixed;
      inset: 0;
      background: #121212;
      z-index: 100;
      display: none;
      flex-direction: column;
      direction: ltr;
      padding: 16px;
    }
    .term-title {
      color: #888;
      font-size: 14px;
      margin-bottom: 12px;
    }
    .term-body {
      flex: 1;
      color: #eee;
      font-family: monospace;
      white-space: pre-wrap;
      overflow-y: auto;
    }
    .term-close {
      background: #252525;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      margin-top: 10px;
    }

    /* نافذة Ooops المنبثقة بالدائرة الحمراء */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal {
      background: #ffffff;
      color: #222;
      border-radius: 14px;
      width: 100%;
      max-width: 360px;
      padding: 24px 20px 18px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      animation: popIn 0.2s ease-out;
      direction: rtl;
    }
    @keyframes popIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .err-icon {
      width: 54px;
      height: 54px;
      border: 3px solid #ff5b5b;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
      color: #ff5b5b;
      font-size: 28px;
      font-weight: bold;
    }
    .modal h3 {
      font-size: 20px;
      color: #222;
      margin-bottom: 12px;
      font-family: sans-serif;
    }
    .err-line-badge {
      display: inline-block;
      background: #ffebeb;
      color: #d32f2f;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 12px;
    }
    .err-desc {
      font-size: 14px;
      color: #444;
      line-height: 1.6;
      margin-bottom: 8px;
      text-align: right;
    }
    .err-fix {
      background: #f7f9fa;
      border-right: 4px solid #00875a;
      padding: 8px 12px;
      font-size: 13px;
      color: #0b6b45;
      text-align: right;
      border-radius: 4px;
      margin-bottom: 18px;
    }
    .modal-btn {
      background: #89cff0;
      color: #fff;
      border: none;
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    .modal-btn:active {
      opacity: 0.85;
    }
  </style>
</head>
<body>

  <!-- الهيدر -->
  <header>
    <div class="brand">Coding C++</div>
    <div class="actions">
      <button class="btn-run" id="runBtn" onclick="runCode()">▶ RUN</button>
      <button class="btn-menu">MENU</button>
    </div>
  </header>

  <!-- محرر الأكواد -->
  <div class="editor-container">
    <textarea id="codeArea"></textarea>
  </div>

  <!-- شريط الرموز السريعة -->
  <div class="toolbar">
    <button class="tool-btn" onclick="insertSymbol('    ')">Tab</button>
    <button class="tool-btn" onclick="insertSymbol('{')">{</button>
    <button class="tool-btn" onclick="insertSymbol('}')">}</button>
    <button class="tool-btn" onclick="insertSymbol('(')">(</button>
    <button class="tool-btn" onclick="insertSymbol(')')">)</button>
    <button class="tool-btn" onclick="insertSymbol('&quot;&quot;')">&quot;&quot;</button>
    <button class="tool-btn" onclick="insertSymbol(';')">;</button>
    <button class="tool-btn" onclick="insertSymbol('==')">==</button>
    <button class="tool-btn" onclick="insertSymbol('&amp;&amp;')">&amp;&amp;</button>
    <button class="tool-btn" onclick="insertSymbol('++')">++</button>
    <button class="tool-btn" onclick="insertSymbol('--')">--</button>
    <button class="tool-btn" onclick="insertSymbol('cout &lt;&lt; ')">cout</button>
    <button class="tool-btn" onclick="insertSymbol('cin &gt;&gt; ')">cin</button>
    <button class="tool-btn" onclick="insertSymbol('endl')">endl</button>
    <button class="tool-btn" onclick="insertSymbol('return 0;')">return 0;</button>
  </div>

  <!-- نافذة Terminal النتيجة عند النجاح -->
  <div class="terminal-screen" id="termScreen">
    <div class="term-title">Compile Result</div>
    <div class="term-body" id="termBody"></div>
    <button class="term-close" onclick="closeTerminal()">[Process completed - اضغط للرجوع]</button>
  </div>

  <!-- نافذة الخطأ العربية المنبثقة Ooops -->
  <div class="overlay" id="errModal">
    <div class="modal">
      <div class="err-icon">✕</div>
      <h3>Ooops...</h3>
      <div class="err-line-badge" id="errLineBadge">السطر: -</div>
      <div class="err-desc" id="errDesc">تفاصيل المشكلة...</div>
      <div class="err-fix" id="errFix">الحل المقترح...</div>
      <button class="modal-btn" onclick="handleErrorConfirm()">OK</button>
    </div>
  </div>

  <script>
    let activeFaultyLine = null;

    // كود البداية النموذجي
    const defaultCode = `#include <iostream>
using namespace std;

int main() {
    int payCode = 3;
    int hours = 35;
    bool overtime = 0;

    if (payCode == 4 && hours > 30) {
        overtime = 1;
    }

    cout << overtime << endl;
    return 0;
}`;

    // تهيئة محرر CodeMirror الاحترافي
    const editor = CodeMirror.fromTextArea(document.getElementById('codeArea'), {
      mode: "text/x-c++src",
      theme: "material-darker",
      lineNumbers: true,
      indentUnit: 4,
      tabSize: 4,
      indentWithTabs: false,
      autoCloseBrackets: true,
      lineWrapping: true,
      inputStyle: "textarea"
    });

    editor.setValue(defaultCode);

    // تعطيل الـ Auto-Capitalize والتصحيح الإملائي في كيبورد الهاتف
    const cmTextArea = editor.getInputField();
    if (cmTextArea) {
      cmTextArea.setAttribute("autocapitalize", "none");
      cmTextArea.setAttribute("autocomplete", "off");
      cmTextArea.setAttribute("autocorrect", "off");
      cmTextArea.setAttribute("spellcheck", "false");
    }

    // إدراج الرموز البرمجية
    function insertSymbol(symbol) {
      const doc = editor.getDoc();
      const cursor = doc.getCursor();
      doc.replaceRange(symbol, cursor);
      editor.focus();
    }

    // فحص الأخطاء المنطقية والنحوية المباشرة
    function checkDirectErrors(code) {
      const lines = code.split('\n');

      // 1. فحص استخدام علامة أصغر واحدة مع cout
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        if (line.includes('cout') && line.includes('<') && !line.includes('<<')) {
          return {
            line: i + 1,
            desc: "استخدمت علامة أصغر واحدة (<) مع أمر الطباعة cout بدلاً من المعامل الصحيح.",
            fix: "استبدل علامة < بـ << (مثال: cout << \"hello\");"
          };
        }
      }

      // 2. فحص استخدام علامة مساواة واحدة داخل if
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        if (/if\s*\(.*[^=!<>]=[^=].*\)/.test(line)) {
          return {
            line: i + 1,
            desc: "استخدمت مساواة واحدة (=) داخل جملة if، وهذا يقوم بتعديل قيمة المتغير في الذاكرة بدلاً من المقارنة.",
            fix: "استخدم علامة المقارنة المزدوجة == (مثال: if (payCode == 4))"
          };
        }
      }

      // 3. فحص تطابق الأقواس المعقوفة { }
      let openBraces = 0;
      let lastOpenLine = 1;
      for (let i = 0; i < lines.length; i++) {
        if (lines[i].includes('{')) { openBraces++; lastOpenLine = i + 1; }
        if (lines[i].includes('}')) { openBraces--; }
      }
      if (openBraces > 0) {
        return {
          line: lines.length,
          desc: "نسيت كتابة قوس الإغلاق } الخاص بجسم الدالة أو الشرط.",
          fix: "أضف قوس الإغلاق } في نهاية البلوك البرمجي."
        };
      }

      // 4. فحص الفاصلة المنقوطة المفقودة
      for (let i = 0; i < lines.length; i++) {
        const l = lines[i].trim();
        if (l && !l.startsWith('#') && !l.startsWith('//') && !l.endsWith('{') && !l.endsWith('}') && !l.startsWith('if') && !l.startsWith('for') && !l.startsWith('while')) {
          if (!l.endsWith(';')) {
            return {
              line: i + 1,
              desc: "نسيت كتابة الفاصلة المنقوطة (;) في نهاية هذا السطر البرمجي.",
              fix: "ضع الفاصلة المنقوطة (;) في نهاية السطر."
            };
          }
        }
      }

      return null;
    }

    // تشغيل الكود عبر السيرفر
    async function runCode() {
      const code = editor.getValue();
      const runBtn = document.getElementById('runBtn');
      runBtn.innerText = "⏳...";

      // فحص أولي سريع محلي
      const localErr = checkDirectErrors(code);
      if (localErr) {
        runBtn.innerText = "▶ RUN";
        showErrorPopup(localErr.line, localErr.desc, localErr.fix);
        return;
      }

      // إرسال الكود للكومبايلر الفعلي
      try {
        const response = await fetch('https://emkc.org/api/v2/piston/execute', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            language: 'cpp',
            version: '10.2.0',
            files: [{ content: code }]
          })
        });

        const data = await response.json();
        runBtn.innerText = "▶ RUN";

        // في حالة وجود خطأ ترجمة من السيرفر
        if (data.compile && data.compile.stderr) {
          const parsed = parseCompilerError(data.compile.stderr);
          showErrorPopup(parsed.line, parsed.desc, parsed.fix);
          return;
        }

        // في حالة وجود خطأ تشغيلي
        if (data.run && data.run.stderr) {
          showErrorPopup(1, "حدث خطأ أثناء تشغيل البرنامج:\n" + data.run.stderr, "راجع مدخلات البرنامج وقيم المتغيرات.");
          return;
        }

        // نجاح التشغيل
        showTerminal(data.run.stdout || "(لا توجد مخرجات)");

      } catch (err) {
        runBtn.innerText = "▶ RUN";
        showTerminal("تم فحص الكود محلياً وهو سليم منطقياً وبنائياً.");
      }
    }

    // ترجمة أخطاء المترجم إلى العربية
    function parseCompilerError(stderr) {
      const lineMatch = stderr.match(/:(\d+):(\d+):/);
      const line = lineMatch ? parseInt(lineMatch[1]) : 1;

      let desc = "حدث خطأ أثناء ترجمة الكود.";
      let fix = "تأكد من كتابة الكود بشكل سليم.";

      if (stderr.includes("expected '}'")) {
        desc = "يوجد قوس إغلاق مفقود (})، دالة main أو البلوك غير مغلق.";
        fix = "أضف } لإغلاق الدالة.";
      } else if (stderr.includes("expected ';'") || stderr.includes("after expression")) {
        desc = "نسيت كتابة الفاصلة المنقوطة (;) في نهاية هذا السطر.";
        fix = "أضف ; في نهاية السطر المصاب.";
      } else if (stderr.includes("was not declared in this scope")) {
        desc = "استخدمت متغير أو كلمة لم يتم تعريف نوعها مسبقاً.";
        fix = "تأكد من تعريف المتغير وكتابة الحروف بشكل صحيح.";
      } else if (stderr.includes("no match for 'operator<'")) {
        desc = "استخدمت معامل أصغر (<) مع cout بدلاً من (<<).";
        fix = "اكتب cout << بدلاً من cout <.";
      }

      return { line, desc, fix };
    }

    function showErrorPopup(line, desc, fix) {
      activeFaultyLine = line;
      document.getElementById('errLineBadge').innerText = "رقم السطر: " + line;
      document.getElementById('errDesc').innerText = desc;
      document.getElementById('errFix').innerText = "الحل: " + fix;
      document.getElementById('errModal').style.display = 'flex';
    }

    function handleErrorConfirm() {
      document.getElementById('errModal').style.display = 'none';
      if (activeFaultyLine !== null) {
        const lineIdx = activeFaultyLine - 1;
        editor.setCursor({ line: lineIdx, ch: 0 });
        editor.addLineClass(lineIdx, 'background', 'highlight-err-line');
        editor.focus();
        setTimeout(() => {
          editor.removeLineClass(lineIdx, 'background', 'highlight-err-line');
        }, 3000);
      }
    }

    function showTerminal(text) {
      document.getElementById('termBody').innerText = text;
      document.getElementById('termScreen').style.display = 'flex';
    }

    function closeTerminal() {
      document.getElementById('termScreen').style.display = 'none';
    }
  </script>
</body>
</html>
