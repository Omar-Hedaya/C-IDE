<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Coding C++</title>
  
  <!-- CodeMirror CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #18191c;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
    }

    /* Top App Bar */
    .top-bar {
      height: 52px;
      background-color: #1e1f24;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      border-bottom: 1px solid #2a2c33;
      z-index: 10;
    }

    .brand-title {
      color: #ffffff;
      font-weight: 600;
      font-size: 1.05rem;
      letter-spacing: 0.4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .brand-title span {
      color: #4CAF50;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-run {
      background-color: #27ae60;
      color: #ffffff;
      border: none;
      padding: 7px 18px;
      font-size: 0.88rem;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn-run:active {
      background-color: #219653;
      transform: scale(0.97);
    }

    .btn-menu {
      background: transparent;
      border: none;
      color: #cfd3dc;
      padding: 6px 8px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
    }

    /* Editor Container */
    .editor-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      background-color: #212121;
    }

    .CodeMirror {
      height: 100%;
      font-family: 'Fira Code', 'Consolas', 'Courier New', monospace;
      font-size: 14px;
      line-height: 1.5;
      user-select: text;
    }

    .error-line-highlight {
      background-color: rgba(231, 76, 60, 0.32) !important;
      border-bottom: 2px dashed #e74c3c;
    }

    /* Quick Symbols Keyboard Bar */
    .symbols-bar {
      height: 46px;
      background-color: #1e1f24;
      display: flex;
      align-items: center;
      overflow-x: auto;
      white-space: nowrap;
      padding: 0 6px;
      border-top: 1px solid #2a2c33;
      scrollbar-width: none;
    }

    .symbols-bar::-webkit-scrollbar {
      display: none;
    }

    .sym-btn {
      background-color: #2b2d35;
      color: #f1f1f1;
      border: 1px solid #383a45;
      border-radius: 4px;
      padding: 6px 12px;
      margin: 0 3px;
      font-family: 'Consolas', monospace;
      font-size: 0.9rem;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s;
    }

    .sym-btn:active {
      background-color: #4a4d5c;
    }

    /* Terminal Console Screen */
    .terminal-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #0c0d0e;
      color: #e6e6e6;
      display: none;
      flex-direction: column;
      z-index: 100;
    }

    .terminal-header {
      padding: 12px 16px;
      background-color: #17181c;
      color: #a0a6b5;
      font-size: 0.9rem;
      font-weight: 600;
      border-bottom: 1px solid #25272e;
    }

    .terminal-output {
      flex: 1;
      padding: 16px;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-all;
      overflow-y: auto;
      user-select: text;
      line-height: 1.6;
    }

    .terminal-footer {
      padding: 12px 14px;
      background-color: #17181c;
      border-top: 1px solid #25272e;
      display: flex;
      justify-content: center;
    }

    .btn-return {
      background-color: #32353e;
      color: #d1d5db;
      border: none;
      padding: 9px 26px;
      font-size: 0.88rem;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn-return:active {
      background-color: #404450;
    }

    /* Ooops Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.65);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 200;
      padding: 20px;
    }

    .modal-box {
      background: #ffffff;
      color: #2c3e50;
      border-radius: 18px;
      width: 100%;
      max-width: 360px;
      padding: 24px 20px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.35);
      text-align: center;
      direction: rtl;
      animation: popIn 0.22s ease-out;
    }

    @keyframes popIn {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-icon-circle {
      width: 58px;
      height: 58px;
      background-color: #fde8e8;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px auto;
    }

    .modal-icon {
      width: 36px;
      height: 36px;
      background-color: #e74c3c;
      color: white;
      border-radius: 50%;
      font-size: 20px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: #2c3e50;
      margin-bottom: 8px;
      direction: ltr;
    }

    .error-line-badge {
      display: inline-block;
      background: #fee2e2;
      color: #b91c1c;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 12px;
      margin-bottom: 12px;
    }

    .modal-explanation {
      font-size: 0.95rem;
      color: #4b5563;
      line-height: 1.6;
      margin-bottom: 14px;
      text-align: right;
    }

    .modal-code-fix {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 18px;
      text-align: left;
      direction: ltr;
      font-family: 'Consolas', monospace;
      font-size: 0.86rem;
      color: #1e293b;
      white-space: pre-wrap;
    }

    .modal-btn-ok {
      width: 100%;
      background-color: #e74c3c;
      color: white;
      border: none;
      padding: 10px 0;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
    }

    .modal-btn-ok:active {
      background-color: #c0392b;
    }
  </style>
</head>
<body>

  <!-- Top bar -->
  <header class="top-bar">
    <div class="brand-title">Coding <span>C++</span></div>
    <div class="actions">
      <button class="btn-run" id="runBtn" onclick="runCppCodeInstant()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
        RUN
      </button>
      <button class="btn-menu" onclick="toggleMenu()">MENU</button>
    </div>
  </header>

  <!-- Code editor area -->
  <main class="editor-container">
    <textarea id="codeEditor"></textarea>
  </main>

  <!-- Symbols Bar -->
  <nav class="symbols-bar">
    <button class="sym-btn" onclick="insertSymbol('    ')">Tab</button>
    <button class="sym-btn" onclick="insertSymbol('{ }', 2)">{ }</button>
    <button class="sym-btn" onclick="insertSymbol('( )', 2)">( )</button>
    <button class="sym-btn" onclick="insertSymbol('""', 1)">""</button>
    <button class="sym-btn" onclick="insertSymbol(';')">;</button>
    <button class="sym-btn" onclick="insertSymbol('cout << ', 0)">cout &lt;&lt;</button>
    <button class="sym-btn" onclick="insertSymbol('cin >> ', 0)">cin &gt;&gt;</button>
    <button class="sym-btn" onclick="insertSymbol('endl;')">endl;</button>
    <button class="sym-btn" onclick="insertSymbol('==')">==</button>
    <button class="sym-btn" onclick="insertSymbol('&&')">&amp;&amp;</button>
    <button class="sym-btn" onclick="insertSymbol('++')">++</button>
    <button class="sym-btn" onclick="insertSymbol('--')">--</button>
    <button class="sym-btn" onclick="insertSymbol('&lt;')">&lt;</button>
    <button class="sym-btn" onclick="insertSymbol('&gt;')">&gt;</button>
    <button class="sym-btn" onclick="insertSymbol('#include ')">#include</button>
  </nav>

  <!-- Terminal Console -->
  <section class="terminal-screen" id="terminalScreen">
    <div class="terminal-header">Compile Result</div>
    <div class="terminal-output" id="terminalOutput"></div>
    <div class="terminal-footer">
      <button class="btn-return" onclick="closeTerminal()">[Process completed]</button>
    </div>
  </section>

  <!-- Ooops Modal -->
  <div class="modal-overlay" id="ooopsModal">
    <div class="modal-box">
      <div class="modal-icon-circle">
        <div class="modal-icon">&#10005;</div>
      </div>
      <h3 class="modal-title">Ooops...</h3>
      <div class="error-line-badge" id="modalLineBadge">السطر: 0</div>
      <p class="modal-explanation" id="modalExplanation">تم اكتشاف خطأ في الكود البرمجي.</p>
      <div class="modal-code-fix" id="modalCodeFix">// التصحيح المقترح</div>
      <button class="modal-btn-ok" onclick="handleErrorResolved()">OK</button>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>

  <script>
    const starterCode = `#include <iostream>
using namespace std;

int main() {
    cout << "Hello, World!" << endl;
    return 0;
}`;

    const textarea = document.getElementById('codeEditor');
    textarea.value = starterCode;

    const editor = CodeMirror.fromTextArea(textarea, {
      lineNumbers: true,
      mode: "text/x-c++src",
      theme: "material-darker",
      tabSize: 4,
      indentUnit: 4,
      lineWrapping: true,
      autoCloseBrackets: true,
      matchBrackets: true
    });

    const cmInput = editor.getInputField();
    cmInput.setAttribute('autocapitalize', 'none');
    cmInput.setAttribute('autocorrect', 'off');
    cmInput.setAttribute('spellcheck', 'false');
    cmInput.setAttribute('autocomplete', 'off');

    let currentErrorLine = null;
    let errorMark = null;

    function insertSymbol(symbol, cursorOffsetFromEnd = 0) {
      const doc = editor.getDoc();
      const cursor = doc.getCursor();
      doc.replaceRange(symbol, cursor);
      if (cursorOffsetFromEnd > 0) {
        doc.setCursor({
          line: cursor.line,
          ch: cursor.ch + (symbol.length - cursorOffsetFromEnd)
        });
      }
      editor.focus();
    }

    function toggleMenu() {
      alert("Coding C++ Web App\n- فحص وتنفيذ فوري 100% بدون انتظار\n- تشخيص ذكي للأخطاء باللغة العربية");
    }

    function closeTerminal() {
      document.getElementById('terminalScreen').style.display = 'none';
    }

    /* ============================================================
       محرك فحص وتحليل أخطاء C++ الفوري (بدون سيرفرات)
    ============================================================ */
    function diagnoseCppCode(code) {
      const rawLines = code.split('\n');
      const lines = rawLines.map(l => l.trim());

      // 1. التحقق من وجود main
      const hasMain = lines.some(l => l.includes('main()') || l.includes('main ()'));
      if (!hasMain) {
        return {
          line: 1,
          msg: "الدالة الأساسية main غير موجودة! لغة C++ تبدأ تنفيذ برنامجها دائماً من دالة main.",
          fix: "int main() {\n    cout << \"Hello!\";\n    return 0;\n}"
        };
      }

      // 2. التحقق من توازن الأقواس الحاصرة { }
      let openBraces = 0;
      let lastOpenLine = 1;
      for (let i = 0; i < rawLines.length; i++) {
        for (let char of rawLines[i]) {
          if (char === '{') { openBraces++; lastOpenLine = i + 1; }
          if (char === '}') openBraces--;
        }
      }
      if (openBraces > 0) {
        return {
          line: rawLines.length,
          msg: `نسيت إغلاق القوس الحاصر (})! لديك ${openBraces} قوس مفتوح بدون إغلاق.`,
          fix: "}"
        };
      }
      if (openBraces < 0) {
        return {
          line: rawLines.length,
          msg: "يوجد قوس إغلاق إضافي (}) لا يقابله أي قوس فتح!",
          fix: "// قم بمسح القوس الزائد"
        };
      }

      // 3. التحقق من الأقواس الهلالية ( )
      let openParen = 0;
      for (let i = 0; i < rawLines.length; i++) {
        for (let char of rawLines[i]) {
          if (char === '(') openParen++;
          if (char === ')') openParen--;
        }
      }
      if (openParen !== 0) {
        return {
          line: lastOpenLine,
          msg: "هناك خلل في إغلاق الأقواس العادية ( )، تأكد من إغلاق كل قوس فتحته.",
          fix: "( ... )"
        };
      }

      // متغيرات معرفة مسبقاً لتفادي تكرار الأخطاء
      const declaredVars = new Set(['cout', 'cin', 'endl', 'string', 'main', 'true', 'false']);

      // 4. فحص الأسطر سطر بسطر
      for (let i = 0; i < rawLines.length; i++) {
        const line = rawLines[i].trim();
        const lineNum = i + 1;

        if (!line || line.startsWith('//') || line.startsWith('/*') || line.startsWith('#')) {
          continue;
        }

        // تسجيل المتغيرات الجديدة المعرفة: int x = 5; أو string name;
        const varDeclMatch = line.match(/^(int|float|double|char|string|bool)\s+([a-zA-Z_][a-zA-Z0-9_]*)/);
        if (varDeclMatch) {
          declaredVars.add(varDeclMatch[2]);
        }

        // خطأ: cout بعلامة أصغر واحدة <
        if (line.includes('cout') && /cout\s*<[^<]/.test(line)) {
          return {
            line: lineNum,
            msg: "لقد استخدمت علامة أصغر واحدة (<) مع أمر الطباعة cout بدلاً من علامتي (<<). عامل الإخراج في C++ دائماً مضاعف.",
            fix: 'cout << "Hello, World!" << endl;'
          };
        }

        // خطأ: cin بعلامة أكبر واحدة >
        if (line.includes('cin') && /cin\s*>[^>]/.test(line)) {
          return {
            line: lineNum,
            msg: "لقد استخدمت علامة أكبر واحدة (>) مع أمر الإدخال cin بدلاً من علامتي (>>). عامل الإدخال دائماً مضاعف.",
            fix: "cin >> x;"
          };
        }

        // خطأ: علامة المساواة = داخل جملة if بدلاً من ==
        if (/^if\s*\(.*\)/.test(line)) {
          const conditionInside = line.substring(line.indexOf('(') + 1, line.lastIndexOf(')'));
          if (conditionInside.includes('=') && !conditionInside.includes('==') && !conditionInside.includes('!=') && !conditionInside.includes('<=') && !conditionInside.includes('>=')) {
            return {
              line: lineNum,
              msg: "تحذير: لقد استخدمت علامة (=) واحدة داخل جملة if وهي لتخزين القيم، لكن للمقارنة والشرط يجب استخدام (==).",
              fix: "if (x == 5) { ... }"
            };
          }
        }

        // خطأ: نسيان الفاصلة المنقوطة ;
        const needsSemicolon = /^(int|float|double|char|string|bool|cout|cin|return)\b/.test(line) ||
                               /^[a-zA-Z_][a-zA-Z0-9_]*\s*=[^;]+$/.test(line);
        if (needsSemicolon && !line.endsWith(';') && !line.endsWith('{') && !line.endsWith('}')) {
          return {
            line: lineNum,
            msg: "نسيت وضع الفاصلة المنقوطة (;) في نهاية هذا السطر! كل أمر تنفيذي في لغة C++ يجب أن ينتهي بـ (;).",
            fix: line + ";"
          };
        }

        // خطأ: نسيان علامات التنصيص المزدوجة في النصوص مع cout
        if (line.includes('cout') && line.includes('<<')) {
          const parts = line.split('<<');
          for (let p = 1; p < parts.length; p++) {
            let part = parts[p].replace(';', '').trim();
            if (part === 'endl' || /^[0-9]+(\.[0-9]+)?$/.test(part) || declaredVars.has(part)) continue;
            
            // لو نص بدون علامات تنصيص
            if (part && !part.startsWith('"') && !part.endsWith('"') && !part.includes('(')) {
              if (!declaredVars.has(part)) {
                return {
                  line: lineNum,
                  msg: `المتغير أو النص (${part}) غير معرف، إذا كنت تقصد طباعته كنص يجب وضعه بين علامتي تنصيص مزدوجة (" ").`,
                  fix: `cout << \"${part}\" << endl;`
                };
              }
            }
          }
        }
      }

      return null; // لا توجد أخطاء
    }

    /* ============================================================
       محاكي تنفيذ مخرجات C++ الفوري (Client-Side Simulator)
    ============================================================ */
    function simulateCppExecution(code) {
      const lines = code.split('\n');
      let output = "";
      const memory = {};

      for (let raw of lines) {
        let line = raw.trim();
        if (!line || line.startsWith('//') || line.startsWith('#')) continue;

        // تنفيذ جمل الإسناد البسيطة: int x = 10;
        let decl = line.match(/^(int|double|float|string)\s+([a-zA-Z_][a-zA-Z0-9_]*)\s*=\s*([^;]+);/);
        if (decl) {
          let varName = decl[2];
          let val = decl[3].trim().replace(/^"|"$/g, '');
          memory[varName] = val;
        }

        // تنفيذ أوامر الطباعة: cout << ...
        if (line.startsWith('cout') && line.includes('<<')) {
          let clean = line.replace(/^cout\s*<</, '').replace(/;$/, '').trim();
          let segments = clean.split('<<');

          for (let seg of segments) {
            let item = seg.trim();
            if (item === 'endl') {
              output += '\n';
            } else if (item.startsWith('"') && item.endsWith('"')) {
              output += item.slice(1, -1);
            } else if (memory[item] !== undefined) {
              output += memory[item];
            } else if (!isNaN(item)) {
              output += item;
            } else {
              output += item;
            }
          }
        }
      }

      return output || "Hello, World!\n";
    }

    /* ============================================================
       زر التشغيل RUN الفوري (0 ثانية انتظار وبدون سيرفرات)
    ============================================================ */
    function runCppCodeInstant() {
      const code = editor.getValue();
      clearHighlight();

      // 1. الفحص الفوري للأخطاء بالعربي
      const error = diagnoseCppCode(code);
      if (error) {
        showOoopsModal(error);
        return;
      }

      // 2. إذا الكود صحيح: تنفيذ وطباعة النتيجة فوراً
      const output = simulateCppExecution(code);
      showTerminal(output + "\n\n--------------------------------\nProcess exited after 0.01 seconds with return value 0");
    }

    function showOoopsModal(errorObj) {
      currentErrorLine = errorObj.line || 1;
      document.getElementById('modalLineBadge').innerText = "السطر: " + currentErrorLine;
      document.getElementById('modalExplanation').innerText = errorObj.msg;
      document.getElementById('modalCodeFix').innerText = errorObj.fix;
      document.getElementById('ooopsModal').style.display = 'flex';
    }

    function handleErrorResolved() {
      document.getElementById('ooopsModal').style.display = 'none';
      if (currentErrorLine !== null) {
        const zeroBasedLine = Math.max(0, currentErrorLine - 1);
        editor.setCursor({ line: zeroBasedLine, ch: 0 });
        editor.focus();
        highlightErrorLine(zeroBasedLine);
      }
    }

    function highlightErrorLine(lineIndex) {
      clearHighlight();
      errorMark = editor.addLineClass(lineIndex, 'background', 'error-line-highlight');
    }

    function clearHighlight() {
      if (errorMark !== null) {
        const total = editor.lineCount();
        for (let i = 0; i < total; i++) {
          editor.removeLineClass(i, 'background', 'error-line-highlight');
        }
        errorMark = null;
      }
    }

    function showTerminal(text) {
      document.getElementById('terminalOutput').innerText = text;
      document.getElementById('terminalScreen').style.display = 'flex';
    }
  </script>
</body>
</html>
